<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Art — Preksha</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  @view-transition { navigation: auto; }
  ::view-transition-group(*) { animation-duration: 0.45s; }
  ::view-transition-old(root), ::view-transition-new(root) {
    animation-duration: 0.45s;
    animation-timing-function: ease-in-out;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #FFF5EB;
    font-family: 'Futura', 'Century Gothic', 'Trebuchet MS', sans-serif;
    overflow-x: hidden;
    overflow-y: auto;


  }

  .page {
    position: relative;
    width: 1920px;
    height: 3257px;
    background: #FFF5EB;
  }

  /* Nav lives outside .page so it can be truly position:fixed (an ancestor's
     transform:scale would otherwise turn "fixed" into "absolute"). Its own
     transform:scale mirrors .page's, keeping the same 1920-canvas coordinate
     system for everything inside it. */
  .nav-fixed-wrap {
    position: fixed;
    top: 0; left: 0;
    width: 1920px;
    transform-origin: top left;
    z-index: 10;
    pointer-events: none;
  }
  .nav-fixed-wrap > * { pointer-events: auto; }

  /* ── LEFT PANEL ── */

  /* PREKSHA column: 0–55px */
  @keyframes collapsePreksha { from { width: 160px; } to { width: 55px; } }
  @keyframes collapseFont    { from { font-size: 120px; } to { font-size: 36px; } }
  @keyframes unshiftWork     { from { left: 160px; } to { left: 55px; } }
  @keyframes unshiftArt      { from { left: 205px; } to { left: 100px; } }
  @keyframes unshiftAbout    { from { left: 250px; } to { left: 145px; } }

  .do-collapse .col-preksha  { animation: collapsePreksha 0.5s ease-in-out both; }
  .do-collapse .preksha-label{ animation: collapseFont    0.5s ease-in-out both; }
  .do-collapse .col-work     { animation: unshiftWork     0.5s ease-in-out both; }
  .do-collapse .col-art      { animation: unshiftArt      0.5s ease-in-out both; }
  .do-collapse .col-about    { animation: unshiftAbout    0.5s ease-in-out both; }

  .col-preksha {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 55px;
    background: #FFF5EB;
    border-right: 1px solid rgba(0,0,0,0.5);
    z-index: 10;
  }

  .preksha-label {
    position: absolute;
    top: 450px;
    left: 50%;
    transform: translate(-50%, -50%) rotate(-90deg);
    white-space: nowrap;
    font-family: 'Futura', 'Century Gothic', 'Trebuchet MS', sans-serif;
    font-weight: 500;
    font-size: 36px;
    letter-spacing: 0.02em;
    color: #000;
    user-select: none;
  }

  /* WORK column: 55–100px */
  .col-work {
    position: absolute;
    left: 55px; top: 0; bottom: 0;
    width: 45px;
    background: #FFF5EB;
    border-right: 1px solid rgba(0,0,0,0.5);
    z-index: 10;
  }

  /* ART column: 100–145px (active) */
  .col-art {
    position: absolute;
    left: 100px; top: 0; bottom: 0;
    width: 45px;
    background: #FFF5EB;
    border-right: 1px solid rgba(0,0,0,0.5);
    z-index: 10;
  }

  .art-label {
    position: absolute;
    top: 450px;
    left: 50%;
    transform: translate(-50%, -50%) rotate(-90deg);
    white-space: nowrap;
    font-family: 'Product Sans', 'Inter', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: #000;
    text-decoration: none;
  }

  .col-overlay { position: absolute; inset: 0; display: block; z-index: 2; }
  /* ABOUT column: 145–190px */
  .col-about {
    position: absolute;
    left: 145px; top: 0; bottom: 0;
    width: 45px;
    background: #FFF5EB;
    border-right: 1px solid rgba(0,0,0,0.5);
    z-index: 10;
  }

  .nav-label {
    position: absolute;
    top: 450px;
    left: 50%;
    transform: translate(-50%, -50%) rotate(-90deg);
    white-space: nowrap;
    font-family: 'Product Sans', 'Inter', sans-serif;
    font-size: 18px;
    font-weight: 400;
    color: #000;
    text-decoration: none;
  }

    /* ── VIEW TRANSITION NAMES ── */

  .col-work          { view-transition-name: nav-work; }
  .col-art           { view-transition-name: nav-art; }
  .col-about         { view-transition-name: nav-about; }


  /* ── RIGHT CONTACTS SIDEBAR ── */
  .contacts-sidebar {
    position: absolute;
    right: 0; top: 0; bottom: 0;
    width: 50px;
    background: #FFF5EB;
    border-left: 1px solid rgba(0,0,0,0.5);
    z-index: 10;
    display: flex;
    flex-direction: column;
  }

  .social-link {
    width: 50px;
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-bottom: 1px solid rgba(0,0,0,0.5);
    text-decoration: none;
    color: #000;
    background: #FFF5EB;
    flex-shrink: 0;
  }
  .social-link svg { width: 18px; height: 18px; fill: #000; }

  .sidebar-text {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border-bottom: 1px solid rgba(0,0,0,0.5);
    cursor: pointer;
    text-decoration: none;
    overflow: hidden;
  }

  .sidebar-text span {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.12em;
    color: #000;
    white-space: nowrap;
    transform: rotate(-90deg);
    display: block;
    text-align: center;
  }

  .copyright-bar {
    width: 50px;
    height: 50px;
    background: #FFF5EB;
    border-top: 1px solid rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .copyright-bar span {
    font-family: 'Inter', sans-serif;
    font-size: 20px;
    color: #000;
  }

  /* ── HOVER STATES ── */
  .col-work:hover, .col-about:hover { background: #000; cursor: pointer; }
  .col-work:hover .nav-label, .col-about:hover .nav-label { color: #fff; }
  .social-link:hover { background: #000 !important; }
  .social-link:hover svg { fill: #fff; }
  .sidebar-text:hover { background: #000 !important; }
  .sidebar-text:has(.no-hover-text):hover { background: #FFF5EB !important; cursor: default; }
  .sidebar-text:hover span { color: #fff; }
  .sidebar-text:has(.no-hover-text):hover span { color: #000; }

  /* ── ART IMAGES ── */
  .art-img {
    position: absolute;
    border-radius: 6px;
    object-fit: cover;
    background: #e0e0e0;
    transition: filter 0.4s ease, opacity 0.4s ease;
  }

  .mobile-topbar, .mobile-bottombar { display: none; }

  @media (max-width: 768px) {

    .page {

      display: block !important;
      column-count: 2;
      column-gap: 12px;
      padding: 66px 16px 60px;
    }
    .art-img {

      display: block !important;
      width: 100% !important;
      height: auto !important;
      left: auto !important; top: auto !important;
      margin: 12px 0 !important;
      break-inside: avoid;
    }
    /* Images originally double-width on desktop break out to span the full page */
    .art-img[style*="width:780px"] {
      column-span: all;
    }

    .mobile-topbar {
      display: block;
      position: fixed; top: 0; left: 0;
      width: 100vw; max-width: 100vw;
      background: #FFF5EB;
      border-bottom: 1px solid rgba(0,0,0,0.5);
      z-index: 1000;
    }
    .mobile-topbar-logo {

      height: 44px;
      border-bottom: 1px solid rgba(0,0,0,0.5);
      font-family: 'Futura', 'Century Gothic', 'Trebuchet MS', sans-serif;
      font-weight: 500; font-size: 18px; letter-spacing: 0.06em;

    }
    .mobile-menu-toggle {

      width: 100%; height: 44px;

      background: none; border-left: none; border-right: none; border-top: none; padding: 0;
      cursor: pointer;

    }

    .mobile-topbar-menu {

    }
    .mobile-topbar.menu-open .mobile-topbar-menu { display: flex; }
    .mobile-topbar-row {

      height: 44px;
      border-bottom: 1px solid rgba(0,0,0,0.15);

    .mobile-bottombar {

      font-size: 16px; color: #000;
    }
  }

  .gallery-dimmed .art-img {

    color: #000;
    white-space: nowrap;
  }
</style>

<script>
  function isMobileLayout() { return document.documentElement.clientWidth <= 768; }

  function scaleToFit() {
    const page = document.querySelector('.page');
    if (isMobileLayout()) {
      page.style.transform = 'none';
      page.style.height = 'auto';
      document.body.style.height = 'auto';
      return;
    }
    const scale = document.documentElement.clientWidth / 1920;
    page.style.transformOrigin = 'top left';
    page.style.transform = `scale(${scale})`;
    document.body.style.height = (3257 * scale) + 'px';
    const navWrap = document.querySelector('.nav-fixed-wrap');
    navWrap.style.transform = `scale(${scale})`;
    navWrap.style.height = (window.innerHeight / scale) + 'px';
    document.querySelectorAll('.nav-label, .art-label').forEach(el => { el.style.top = (window.innerHeight / 2 / scale) + 'px'; });
    const pl = document.querySelector('.preksha-label'); if (pl) pl.style.top = (window.innerHeight / 2 / scale) + 'px';
  }
  scaleToFit();
  window.addEventListener('resize', scaleToFit);

  // Hover blur effect
  const page = document.querySelector('.page');
  const artImgs = document.querySelectorAll('.art-img');
  artImgs.forEach(img => {
    img.addEventListener('mouseenter', () => {
      page.classList.add('gallery-dimmed');
      img.classList.add('hovered');
    });
    img.addEventListener('mouseleave', () => {
      page.classList.remove('gallery-dimmed');
      img.classList.remove('hovered');
    });
  });
</script>
