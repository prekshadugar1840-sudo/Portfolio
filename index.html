<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preksha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">
<style>
  @view-transition { navigation: auto; }
  ::view-transition-group(*) { animation-duration: 0.45s; }
  ::view-transition-old(root), ::view-transition-new(root) {
    animation-duration: 0.45s;
    animation-timing-function: ease-in-out;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #000000;
    font-family: 'Futura', 'Century Gothic', 'Trebuchet MS', sans-serif;
    overflow: hidden;
  }

  .page {
    position: relative;
    width: 1920px;
    height: 1080px;
    background: #000000;
  }

  /* ── EXPAND ANIMATION — only when coming from another page via PREKSHA click ── */
  @keyframes expandPreksha { from { width: 55px; } to { width: 160px; } }
  @keyframes expandFont    { from { font-size: 36px; } to { font-size: 120px; } }
  @keyframes shiftWork     { from { left: 100px; } to { left: 160px; } }
  @keyframes shiftArt      { from { left: 145px; } to { left: 205px; } }
  @keyframes shiftAbout    { from { left: 190px; } to { left: 250px; } }
  @keyframes shiftContent  { from { left: 235px; } to { left: 295px; } }

  .do-expand .col-preksha  { animation: expandPreksha 0.5s ease-in-out both; }
  .do-expand .preksha-label{ animation: expandFont    0.5s ease-in-out both; }
  .do-expand .col-work     { animation: shiftWork     0.5s ease-in-out both; }
  .do-expand .col-art      { animation: shiftArt      0.5s ease-in-out both; }
  .do-expand .col-about    { animation: shiftAbout    0.5s ease-in-out both; }
  .do-expand .main-content { animation: shiftContent  0.5s ease-in-out both; }

  /* ── LEFT NAV ── */
  .col-preksha {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 160px;
    background: #FFF5EB;
    border-right: 1px solid rgba(0,0,0,0.5);
    z-index: 10;
    cursor: pointer;
  }
  .preksha-label {
    position: absolute;
    left: 50%;
    font-family: 'Futura', 'Century Gothic', 'Trebuchet MS', sans-serif;
    font-weight: 500;
    font-size: 120px;
    letter-spacing: 0.02em;
    color: #000;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    transform: translate(-50%, -50%) rotate(180deg);
    user-select: none;
    line-height: 1;
  }

  .col-work {
    position: absolute;
    left: 160px; top: 0; bottom: 0;
    width: 45px;
    background: #FFF5EB;
    border-right: 1px solid rgba(0,0,0,0.5);
    z-index: 10;
  }
  .col-art {
    position: absolute;
    left: 205px; top: 0; bottom: 0;
    width: 45px;
    background: #FFF5EB;
    border-right: 1px solid rgba(0,0,0,0.5);
    z-index: 10;
  }
  .col-overlay { position: absolute; inset: 0; display: block; z-index: 2; }
  .col-about {
    position: absolute;
    left: 250px; top: 0; bottom: 0;
    width: 45px;
    background: #FFF5EB;
    border-right: 1px solid rgba(0,0,0,0.5);
    z-index: 10;
  }

  .nav-label {
    position: absolute;
    top: 450px; left: 50%;
    transform: translate(-50%, -50%) rotate(-90deg);
    white-space: nowrap;
    font-family: 'Inter', sans-serif;
    font-size: 18px; font-weight: 400;
    color: #000;
    text-decoration: none;
  }

  /* ── RIGHT SIDEBAR ── */
  .contacts-sidebar {
    position: absolute;
    right: 0; top: 0; bottom: 0;
    width: 50px;
    background: #FFF5EB;
    border-left: 1px solid rgba(0,0,0,0.5);
    z-index: 10;
    display: flex;
    flex-direction: column;
  }
  .social-link {
    width: 50px; height: 50px;
    display: flex; align-items: center; justify-content: center;
    border-bottom: 1px solid rgba(0,0,0,0.5);
    text-decoration: none; color: #000;
    background: #FFF5EB; flex-shrink: 0;
  }
  .social-link svg { width: 18px; height: 18px; fill: #000; }
  .sidebar-text {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    border-bottom: 1px solid rgba(0,0,0,0.5);
    cursor: pointer; text-decoration: none; overflow: hidden;
  }
  .sidebar-text span {
    font-family: 'Inter', sans-serif;
    font-size: 13px; font-weight: 500; letter-spacing: 0.12em;
    color: #000; white-space: nowrap;
    transform: rotate(-90deg); display: block; text-align: center;
  }
  .copyright-bar {
    width: 50px; height: 50px;
    background: #FFF5EB;
    border-top: 1px solid rgba(0,0,0,0.5);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .copyright-bar span { font-family: 'Inter', sans-serif; font-size: 20px; color: #000; }

  /* ── HOVER STATES ── */
  .col-work:hover, .col-art:hover, .col-about:hover { background: #000; cursor: pointer; }
  .col-work:hover .nav-label, .col-art:hover .nav-label, .col-about:hover .nav-label { color: #fff; }
  .social-link:hover { background: #000 !important; }
  .social-link:hover svg { fill: #fff; }
  .sidebar-text:hover { background: #000 !important; }
  .sidebar-text:has(.no-hover-text):hover { background: #FFF5EB !important; cursor: default; }
  .sidebar-text:hover span { color: #fff; }
  .sidebar-text:has(.no-hover-text):hover span { color: #000; }

    /* ── VIEW TRANSITION NAMES ── */

  .col-work          { view-transition-name: nav-work; }
  .col-art           { view-transition-name: nav-art; }
  .col-about         { view-transition-name: nav-about; }


  /* ── MAIN CONTENT ── */
  .main-content {
    position: absolute;
    left: 295px; right: 50px;
    top: 0; bottom: 0;
    background: #000000 url('work/bg.png') center center / cover no-repeat;
    overflow: hidden;
  }

  #physicsCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  .hero-title {
    position: absolute;
    top: 36%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 2;
    pointer-events: none;
    user-select: none;
    text-align: center;
    width: 95%;
  }

  .hero-title h1 {
    font-family: 'Futura', 'Century Gothic', 'Trebuchet MS', sans-serif;
    font-size: 94px;
    font-weight: 400;
    color: #fff;
    line-height: 0.92;
    letter-spacing: -0.02em;
    -webkit-font-smoothing: antialiased;
    margin: 0;
    white-space: nowrap;
  }

  .hero-title .last-line {
    position: relative;
    display: inline-block;
  }

  .hero-title .last-line h1 {
    display: block;
  }

  .hero-title .sub-desc {
    position: absolute;
    left: calc(100% + 24px);
    bottom: 0;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 400;
    color: rgba(255,255,255,0.55);
    line-height: 1.55;
    width: 220px;
    letter-spacing: 0.01em;
    text-align: left;
  }

  /* ── MOBILE NAV (top bar + bottom bar, replaces side columns) ── */
  .mobile-topbar, .mobile-bottombar { display: none; }

  @media (max-width: 768px) {
    .col-preksha, .col-work, .col-art, .col-about, .contacts-sidebar { display: none !important; }
    .page {
      position: fixed !important;
      inset: 88px 0 44px 0 !important;
      width: auto !important;
      height: auto !important;
      transform: none !important;
    }
    .main-content { left: 0 !important; right: 0 !important; top: 0 !important; bottom: 0 !important; }

    .hero-title { width: 90% !important; }
    .hero-title h1 { font-size: 38px !important; white-space: normal !important; line-height: 1.08 !important; }
    .hero-title h1[style*="margin-left"] { margin-left: 0 !important; }
    .hero-title .sub-desc {
      position: static !important;
      width: 100% !important;
      margin: 28px auto 0 !important;
      text-align: center !important;
      font-size: 13px !important;
    }

    .mobile-topbar {
      display: block;
      position: fixed; top: 0; left: 0;
      width: 100vw; max-width: 100vw;
      background: #FFF5EB;
      border-bottom: 1px solid rgba(0,0,0,0.5);
      z-index: 1000;

    .mobile-topbar-logo {
      display: flex; align-items: center; justify-content: center;

      border-bottom: 1px solid rgba(0,0,0,0.5);

      font-weight: 500; font-size: 18px; letter-spacing: 0.06em;
      color: #000; cursor: pointer;
    }
    .mobile-menu-toggle {

      width: 100%; height: 44px;

      background: none; border-left: none; border-right: none; border-top: none; padding: 0;

    .mobile-topbar-row {

      width: 44px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; color: #000;
    }
  }
</style>

<script>
  // ── CANVAS PHYSICS (Verlet, matching reference) ──
  const LABELS = [
    ['UI/UX', 'DESIGN'],
    ['USER', 'RESEARCH'],
    ['PRODUCT', 'STRATEGY'],
    ['DESIGN', 'SYSTEMS'],
    ['PROTOTYPING'],
    ['CONVERSION', 'OPTIMIZATION'],
    ['WEBSITE', 'DESIGN'],
    ['INTERACTION', 'DESIGN'],
    ['INFORMATION', 'ARCHITECTURE'],
    ['HIGH', 'CONVERSION', 'LANDING PAGES'],
    ['APP', 'DESIGN'],
    ['DATA-DRIVEN', 'DESIGN'],
    ['UX AUDIT'],
    ['CONTENT', 'STRATEGY'],
    ['VISUAL', 'DIRECTION'],
  ];

  const canvas = document.getElementById('physicsCanvas');
  const ctx    = canvas.getContext('2d');
  const cont   = document.getElementById('mainContent');

  const GRAVITY_FALL   = 0.5;   // fast gravity while falling
  const GRAVITY_SETTLE = 0.08;  // gentler after landed
  const DAMPING        = 0.52;  // wall/floor bounce damping
  const FRICTION       = 0.985; // per-frame velocity friction

  let gravity = GRAVITY_FALL;
  let fallen  = 0;
  let mouse   = { x: 0, y: 0, over: false };
  let dragged = null;

  class Ball {
    constructor(x, y, r, lines) {
      this.x  = x;  this.y  = y;
      this.px = x;  this.py = y + 0.1; // slight downward vel
      this.r  = r;  this.baseR = r;  this.targetR = r;
      this.lines  = lines;
      this.hover  = false;
      this.isDrag = false;
    }

    applyForce(dt2) {
      if (this.isDrag) return;
      this.py -= gravity * dt2;  // gravity = downward force on py makes y increase
    }

    verlet() {
      if (this.isDrag) return;
      const nx = 2*this.x - this.px;
      const ny = 2*this.y - this.py;
      this.px = this.x; this.py = this.y;
      this.x  = nx;     this.y  = ny;
    }

    constrain(W, H) {
      if (this.isDrag) return;
      const bounce = DAMPING;
      if (this.x - this.r < 0)   { const v = this.x - this.px; this.x = this.r;   this.px = this.x + v * bounce; }
      if (this.x + this.r > W)   { const v = this.x - this.px; this.x = W-this.r; this.px = this.x + v * bounce; }
      if (this.y - this.r < 0)   { const v = this.y - this.py; this.y = this.r;   this.py = this.y + v * bounce; }
      if (this.y + this.r > H)   { const v = this.y - this.py; this.y = H-this.r; this.py = this.y + v * bounce; this.x += (this.px - this.x) * 0.05; } // floor friction
    }

    draw(ctx) {
      // smooth radius animation (grow on drag, shrink on release)
      this.r += (this.targetR - this.r) * 0.15;

      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);

      if (this.hover) {
        ctx.fillStyle = '#fff';
        ctx.fill();
      } else {
        ctx.strokeStyle = 'rgba(255,255,255,0.38)';
        ctx.lineWidth = 1;
        ctx.stroke();
      }

      // text — start from the radius-based size, then shrink further if the
      // longest line would spill past the circle at this ball's actual size
      let fs = Math.max(10, this.r * 0.215);
      ctx.font = `400 ${fs}px Inter, sans-serif`;
      const maxTextWidth = this.r * 1.7;
      const widest = this.lines.reduce((w, line) => Math.max(w, ctx.measureText(line).width), 0);
      if (widest > maxTextWidth) {
        fs *= maxTextWidth / widest;
        fs = Math.max(6, fs);
        ctx.font = `400 ${fs}px Inter, sans-serif`;
      }
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = this.hover ? 'rgba(0,0,0,0.85)' : 'rgba(255,255,255,0.75)';

      const lh = fs * 1.35;
      if (this.lines.length === 1) {
        ctx.fillText(this.lines[0], this.x, this.y);
      } else if (this.lines.length === 2) {
        ctx.fillText(this.lines[0], this.x, this.y - lh / 2);
        ctx.fillText(this.lines[1], this.x, this.y + lh / 2);
      } else {
        ctx.fillText(this.lines[0], this.x, this.y - lh);
        ctx.fillText(this.lines[1], this.x, this.y);
        ctx.fillText(this.lines[2], this.x, this.y + lh);
      }
    }
  }

  let balls = [];
  let cssW = 0, cssH = 0;

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    cssW = cont.offsetWidth;
    cssH = cont.offsetHeight;
    canvas.width  = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function spawnBalls() {
    balls = [];
    const W = cssW;
    const mobile = isMobileLayout();
    LABELS.forEach((lines, i) => {
      const r  = mobile ? (26 + Math.random() * 10) : (68 + Math.random() * 16);
      const x  = (r + 4) + Math.random() * Math.max(1, W - (r + 4) * 2);
      const y  = -r - i * 90;
      setTimeout(() => balls.push(new Ball(x, y, r, lines)), i * 260);
    });
  }

  function resolveCollisions() {
    for (let i = 0; i < balls.length; i++) {
      for (let j = i + 1; j < balls.length; j++) {
        const a = balls[i], b = balls[j];
        const dx = b.x - a.x, dy = b.y - a.y;
        const d  = Math.sqrt(dx*dx + dy*dy);
        const min = a.r + b.r + 1;
        if (d < min && d > 0.001) {
          const nx = dx/d, ny = dy/d;
          const push = (min - d) * 0.5;
          if (!a.isDrag) { a.x -= nx*push; a.y -= ny*push; }
          if (!b.isDrag) { b.x += nx*push; b.y += ny*push; }
        }
      }
    }
  }

  // ── GLOW ──
  let glowX = 0.5, glowY = 0.35;
  let driftT = 0;

  // ── ANIMATED NOISE BACKGROUND ──
  // Small offscreen buffer of hashed value-noise, upscaled with bilinear
  // smoothing so it reads as a slow, softly moving grey haze on black.
  const bgBuffer    = document.createElement('canvas');
  const bgBufferCtx = bgBuffer.getContext('2d');
  const BG_SCALE    = 0.05;
  let bgTime = 0;
  let sweepAngle = 0;

  function hash2(x, y) {
    const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
    return s - Math.floor(s);
  }

  function valueNoise(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf);
    const v = yf * yf * (3 - 2 * yf);
    const a = hash2(xi, yi),     b = hash2(xi + 1, yi);
    const c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }

  function drawBackground(W, H) {
    const bw = Math.max(28, Math.round(W * BG_SCALE));
    const bh = Math.max(18, Math.round(H * BG_SCALE));
    if (bgBuffer.width !== bw || bgBuffer.height !== bh) {
      bgBuffer.width  = bw;
      bgBuffer.height = bh;
    }

    bgTime += 0.00045; // near-imperceptible drift — you should have to watch for a few seconds to notice it moved at all

    const img  = bgBufferCtx.createImageData(bw, bh);
    const data = img.data;
    for (let y = 0; y < bh; y++) {
      for (let x = 0; x < bw; x++) {
        // low frequency -> large, soft, slow-moving fields (not fine grain)
        const nx = (x / bw) * 1.1 + bgTime;
        const ny = (y / bh) * 1.1 - bgTime * 0.6;
        let n  = valueNoise(nx, ny);
        n += 0.4 * valueNoise(nx * 2.0 + 9.1, ny * 2.0 + 3.4);
        n /= 1.4;

        const base = 3, peak = 12; // low contrast — a hint of life, not a visible pattern
        const v = base + n * (peak - base);
        const i = (y * bw + x) * 4;
        data[i] = v; data[i + 1] = v; data[i + 2] = v + 2; data[i + 3] = 90;
      }
    }
    bgBufferCtx.putImageData(img, 0, 0);

    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(0, 0, W, H);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(bgBuffer, 0, 0, bw, bh, 0, 0, W, H);
  }

  function loop() {
    const W = cssW, H = cssH;
    drawBackground(W, H);
    // check if all balls have settled past halfway
    if (fallen < LABELS.length && balls.length === LABELS.length) {
      let below = balls.filter(b => b.y > H * 0.4).length;
      if (below >= LABELS.length) { fallen = LABELS.length; gravity = GRAVITY_SETTLE; }
    }

    balls.forEach(b => {
      if (b.isDrag) {
        // track previous for throw on release
        b.px = b.x; b.py = b.y;
        b.x  = mouse.x; b.y = mouse.y;
      } else {
        b.applyForce(1);
        b.verlet();
        b.constrain(W, H);
      }
    });

    resolveCollisions();
    balls.forEach(b => b.draw(ctx));

    requestAnimationFrame(loop);
  }

  // ── MOUSE HELPERS ──
  function canvasMouse(e) {
    const rect  = cont.getBoundingClientRect();
    const scale = isMobileLayout() ? 1 : (document.documentElement.clientWidth / 1920);
    const point = (e.touches && e.touches[0]) ? e.touches[0] : e;
    return {
      x: (point.clientX - rect.left) / scale,
      y: (point.clientY - rect.top)  / scale,
    };
  }

  // Mouse enters canvas → enable hover detection
  canvas.addEventListener('mouseenter', () => { mouse.over = true; });
  canvas.addEventListener('mouseleave', () => {
    mouse.over = false;
    balls.forEach(b => { b.hover = false; });
    canvas.style.cursor = 'default';
  });

  // Mousemove → update position + hover state
  canvas.addEventListener('mousemove', e => {
    const m = canvasMouse(e);
    mouse.x = m.x; mouse.y = m.y;

    // update hover for all balls
    let anyhover = false;
    balls.forEach(b => {
      const dx = mouse.x - b.x, dy = mouse.y - b.y;
      b.hover = Math.sqrt(dx*dx + dy*dy) < b.r;
      if (b.hover) anyhover = true;
    });
    canvas.style.cursor = anyhover ? 'grab' : 'default';

    // move dragged ball
    if (dragged) {
      dragged.x = mouse.x;
      dragged.y = mouse.y;
    }
  });

  // Mousedown → pick up hovered ball, grow it
  canvas.addEventListener('mousedown', e => {
    const m = canvasMouse(e);
    mouse.x = m.x; mouse.y = m.y;
    for (const b of balls) {
      const dx = mouse.x - b.x, dy = mouse.y - b.y;
      if (Math.sqrt(dx*dx + dy*dy) < b.r) {
        dragged      = b;
        b.isDrag     = true;
        b.hover      = true;
        b.targetR    = b.baseR * 1.38; // grow on drag
        canvas.style.cursor = 'grabbing';
        break;
      }
    }
    e.preventDefault();
  });

  // Mouseup → drop ball, restore size, give it throw velocity
  document.addEventListener('mouseup', () => {
    if (dragged) {
      const b      = dragged;
      b.isDrag     = false;
      b.targetR    = b.baseR;
      // throw: velocity from previous position difference
      const vx = b.x - b.px;
      const vy = b.y - b.py;
      b.px = b.x - vx * 0.6;
      b.py = b.y - vy * 0.6;
      dragged = null;
      canvas.style.cursor = 'grab';
    }
  });

  // ── TOUCH (mirrors the mouse handlers above for real touchscreens) ──
  canvas.addEventListener('touchstart', e => {
    const m = canvasMouse(e);
    mouse.x = m.x; mouse.y = m.y; mouse.over = true;
    for (const b of balls) {
      const dx = mouse.x - b.x, dy = mouse.y - b.y;
      if (Math.sqrt(dx*dx + dy*dy) < b.r) {
        dragged   = b;
        b.isDrag  = true;
        b.hover   = true;
        b.targetR = b.baseR * 1.38;
        break;
      }
    }
    if (dragged) e.preventDefault();
  }, { passive: false });

  canvas.addEventListener('touchmove', e => {
    const m = canvasMouse(e);
    mouse.x = m.x; mouse.y = m.y;
    if (dragged) {
      dragged.x = mouse.x;
      dragged.y = mouse.y;
      e.preventDefault();
    }
  }, { passive: false });

  canvas.addEventListener('touchend', () => {
    mouse.over = false;
    balls.forEach(b => { b.hover = false; });
    if (dragged) {
      const b   = dragged;
      b.isDrag  = false;
      b.targetR = b.baseR;
      const vx = b.x - b.px;
      const vy = b.y - b.py;
      b.px = b.x - vx * 0.6;
      b.py = b.y - vy * 0.6;
      dragged = null;
    }
  });

  // ── SCALE ──
  function isMobileLayout() { return document.documentElement.clientWidth <= 768; }

  function scaleToFit() {
    const page  = document.querySelector('.page');
    if (isMobileLayout()) {
      // Mobile: .page is pinned between the fixed top/bottom bars via CSS
      // (position:fixed; inset), so it's already sized to the real
      // viewport — no transform/height math needed, just sync the canvas.
      page.style.transform = 'none';
      page.style.height = '';
      document.body.style.height = '';
      document.body.style.width = '';
      document.body.style.background = '#000000';
      resize();
      return;
    }
    const scale = document.documentElement.clientWidth / 1920;
    // make page tall enough so the scaled height fills the full viewport
    const minH  = Math.ceil(document.documentElement.clientHeight / scale);
    page.style.height = Math.max(1080, minH) + 'px';
    page.style.transformOrigin = 'top left';
    page.style.transform = `scale(${scale})`;
    document.body.style.height = document.documentElement.clientHeight + 'px';
    document.body.style.width  = document.documentElement.clientWidth  + 'px';
    document.body.style.background = '#000000';
    // resize canvas AFTER page height is set so canvas pixels match container
    resize();
    document.querySelectorAll('.nav-label').forEach(el => { el.style.top = (document.documentElement.clientHeight / 2 / scale) + 'px'; });
    const prekshaLabel = document.querySelector('.preksha-label');
    if (prekshaLabel) prekshaLabel.style.top = (document.documentElement.clientHeight * 0.50 / scale) + 'px';
    // PREKSHA: pin vertical center to viewport center
    const preLabel = document.querySelector('.preksha-label');
    if (preLabel) preLabel.parentElement.style.justifyContent = 'center';
  }

  scaleToFit();
  spawnBalls();
  loop();
  window.addEventListener('resize', scaleToFit);
</script>
</body>
</html>
