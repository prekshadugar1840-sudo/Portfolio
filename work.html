<style>
  @view-transition { navigation: auto; }
  ::view-transition-group(*) { animation-duration: 0.45s; }
  ::view-transition-old(root), ::view-transition-new(root) {
    animation-duration: 0.45s;
    animation-timing-function: ease-in-out;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {

    font-family: 'Futura', 'Century Gothic', 'Trebuchet MS', sans-serif;
    overflow-x: hidden;
    overflow-y: auto;
  }

  .page {

    width: 1920px;
    height: 3780px; /* 3×900 + 1080 — last section needs full viewport height */
    background: #0e0e0e;
  }

  /* ── LEFT NAV ── */
  .col-name {
    position: absolute; left: 0; top: 0; width: 55px;
    background: #FFF5EB; border-right: 1px solid rgba(0,0,0,0.5); z-index: 20; cursor: pointer;
  }
  .name-rotated {
    position: absolute; top: 450px; left: 50%;
    transform: translate(-50%, -50%) rotate(-90deg);
    white-space: nowrap;
    font-family: 'Futura', 'Century Gothic', 'Trebuchet MS', sans-serif;
    font-weight: 500; font-size: 36px; letter-spacing: 0.02em; color: #000; user-select: none;
  }
  .col-work {
    position: absolute; left: 55px; top: 0; width: 45px;
    background: #0e0e0e; border-right: 1px solid rgba(0,0,0,0.5); z-index: 20;
    view-transition-name: nav-work;
  }
  .col-art {
    position: absolute; left: 100px; top: 0; width: 45px;
    background: #FFF5EB; border-right: 1px solid rgba(0,0,0,0.5); z-index: 20;
    view-transition-name: nav-art;
  }
  .col-about {
    position: absolute; left: 145px; top: 0; width: 45px;
    background: #FFF5EB; border-right: 1px solid rgba(0,0,0,0.5); z-index: 20;
    view-transition-name: nav-about;
  }
  .col-overlay { position: absolute; inset: 0; display: block; z-index: 2; }
  .nav-label {
    position: absolute; top: 450px; left: 50%;
    width: 100px; display: block; text-align: center;
    transform: translate(-50%, -50%) rotate(-90deg);
    white-space: nowrap;
    font-family: 'Futura', 'Century Gothic', 'Trebuchet MS', sans-serif;
    font-size: 18px; font-weight: 400; color: #000; cursor: pointer; text-decoration: none;
  }
  .nav-label-active {
    position: absolute; top: 450px; left: 50%;
    width: 100px; display: block; text-align: center;
    transform: translate(-50%, -50%) rotate(-90deg);
    white-space: nowrap;
    font-family: 'Futura', 'Century Gothic', 'Trebuchet MS', sans-serif;
    font-size: 18px; font-weight: 400; color: #fff; text-decoration: none;

  .col-art:hover, .col-about:hover { background: #0e0e0e; cursor: pointer; }
  .col-art:hover .nav-label, .col-about:hover .nav-label { color: #fff; }

  /* ── RIGHT SIDEBAR ── */
  .contacts-sidebar {
    position: absolute; right: 0; top: 0; width: 50px; height: 1080px;

  .copyright-bar {

  .proj-title-clip {

    width: 1450px;
    height: 150px;
    overflow: hidden;
    z-index: 5;
    pointer-events: none;

  .proj-title-track {
    width: 100%;
    will-change: transform;
  }
  .proj-title {

    left: 320px;
    width: 1450px;
    height: 150px;
    z-index: 6;
    display: block;
    text-decoration: none;

  /* Counter */
  .proj-counter-clip {

  .proj-counter-item {

  .proj-counter-line {

  }
</style>

  const CANVAS_VH  = 1080;

  let canvasVH = 1080; // actual canvas viewport height, updated on resize

  const projects = [
    { co: 'CYBERPEACE FOUNDATION', type: 'CYBER SECURITY (NGO)', role: 'DIGITAL INFRASTRUCTURE REDESIGN + UI DESIGN', year: '2023', link: 'cpf.html' },
    { co: 'INFEEDO',               type: 'HR TECH',  role: 'DESIGN RESEARCH + UI/UX DESIGN', year: '2021', link: 'infeedo.html' },
    { co: 'VEDANTA SPARK',         type: 'SUSTAINABILITY',           role: 'RESEARCH & STRATEGY + UI/UX DESIGN + PROJECT MANAGEMENT', year: '2022', link: 'vedanta.html' },
    { co: 'TOKEE',                 type: 'MESSAGING & COMMUNICATION', role: 'UX STRATEGY + PRODUCT DESIGN + WEBSITE DESIGN', year: '2023', link: 'tokee.html' }
  ];

  const titleClip  = document.getElementById('titleClip');
  const titleTrack = document.getElementById('titleTrack');
  const titleLink  = document.getElementById('titleLink');
  const counterEl      = document.getElementById('counter');
  const counterTrack   = document.getElementById('counterTrack');
  const counterLine    = document.getElementById('counterLine');
  const projDesc   = document.getElementById('projDesc');
  const projCo     = document.getElementById('projCo');
  const projType   = document.getElementById('projType');
  const projRole   = document.getElementById('projRole');
  const projYear   = document.getElementById('projYear');
  const bulletEls  = document.querySelectorAll('.proj-bullet');
  const bulletsEl  = document.getElementById('bulletsContainer');
  const navEls     = document.querySelectorAll('.col-name, .col-work, .col-art, .col-about, #sidebar');

  let activeIdx   = 0;   // currently displayed project
  let isScrolling = false;
  let scrollTimer;
  let isSnapping  = false;

  function updateText(idx) {
    if (idx === activeIdx && projDesc.style.opacity === '1') return;
    activeIdx = idx;
    const p = projects[idx];
    // counter track is driven by scroll, no manual update needed
    titleLink.href        = p.link;
    bulletEls.forEach((b, i) => b.classList.toggle('active', i === idx));
    // Fade in description
    projCo.textContent    = p.co;
    projType.textContent  = p.type;
    projRole.textContent  = p.role;
    projYear.textContent  = p.year;
    projDesc.style.opacity = '1';
  }

  function layout() {
    const scale = window.innerWidth / CANVAS_W;
    const s = window.scrollY / scale; // scroll in canvas coords

    // Sticky nav — height matches actual canvas viewport
    navEls.forEach(el => {
      el.style.top    = s + 'px';
      el.style.height = canvasVH + 'px';
    });

    // All text positions derived from actual image top (centered in real viewport)
    const iTop = imgTops[0] - Math.round(0 * SECTION_H); // = imgTop0
    const titleTop   = iTop + 410;   // 410px below image top
    const counterTop = iTop + 473;
    const lineTop    = iTop + 505;
    const descTop    = iTop + IMG_H + 35;
    const bulletsTop = iTop + 230;

    titleClip.style.top  = (s + titleTop)   + 'px';
    titleLink.style.top  = (s + titleTop)   + 'px';
    counterEl.style.top  = (s + counterTop) + 'px';
    counterLine.style.top= (s + lineTop)    + 'px';
    projDesc.style.top   = (s + descTop)    + 'px';
    bulletsEl.style.top  = (s + bulletsTop) + 'px';

    // Title: scroll-driven continuously, clamped to last project
    const titleProgress = Math.min(s / SECTION_H, NUM_PROJ - 1);
    titleTrack.style.transform   = `translateY(${-titleProgress * TITLE_H}px)`;
    counterTrack.style.transform = `translateY(${-titleProgress * 24}px)`;

    // Clip each image at viewport edges + scale down as it exits at the top
    imgEls.forEach((el, i) => {
      const imgTop    = imgTops[i];
      const imgBottom = imgTop + IMG_H;
      const vpTop     = s;
      const vpBottom  = s + CANVAS_VH;
      const clipTop    = Math.max(0, vpTop - imgTop);
      const clipBottom = Math.max(0, imgBottom - vpBottom);
      el.style.clipPath = `inset(${clipTop}px 0px ${clipBottom}px 0px round 24px)`;

      // Scale image down as it exits upward (0 = full size, 1 = fully gone)
      const exitProgress = Math.min(1, clipTop / (IMG_H * 0.6));
      const sc = 1 - exitProgress * 0.13;
      el.querySelector('img').style.transform = `scale(${sc})`;
      el.querySelector('img').style.transformOrigin = 'center bottom';
    });
  }

  let currentSection = 0;
  let snapRaf = null;

  function snapTo(idx) {
    idx = Math.max(0, Math.min(NUM_PROJ - 1, idx));
    if (isSnapping) return;
    isSnapping = true;
    projDesc.style.opacity = '0';

    const scale   = window.innerWidth / CANVAS_W;
    const targetY = idx * SECTION_H * scale;
    const startY  = window.scrollY;
    const dist    = targetY - startY;
    let startTime = null;

    if (snapRaf) cancelAnimationFrame(snapRaf);

    function step(ts) {
      if (!startTime) startTime = ts;
      const t    = Math.min((ts - startTime) / 750, 1);
      const ease = t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2;
      window.scrollTo(0, startY + dist * ease);
      layout();
      if (t < 1) {
        snapRaf = requestAnimationFrame(step);
      } else {
        window.scrollTo(0, targetY);
        currentSection = idx;
        isSnapping  = false;
        isScrolling = false;
        updateText(idx);
      }
    }
    snapRaf = requestAnimationFrame(step);
  }

  // Wheel-based snap — intercept entirely so momentum can't fight us
  let wheelDelta = 0;
  let wheelTimer = null;
  window.addEventListener('wheel', e => {
    e.preventDefault();
    if (isSnapping) return;
    wheelDelta += e.deltaY;
    clearTimeout(wheelTimer);
    wheelTimer = setTimeout(() => {
      if (Math.abs(wheelDelta) > 20) {
        snapTo(currentSection + (wheelDelta > 0 ? 1 : -1));
      }
      wheelDelta = 0;
    }, 50);
  }, { passive: false });

  function onScroll() {
    if (!isSnapping) layout();
  }

  function scaleToFit() {
    const page  = document.querySelector('.page');
    const scale = window.innerWidth / CANVAS_W;
    page.style.transformOrigin = 'top left';
    page.style.transform = `scale(${scale})`;

    // Actual canvas viewport height for this screen
    canvasVH = window.innerHeight / scale;

    // Center images vertically in whatever the real viewport is
    const imgTop0 = Math.round((canvasVH - IMG_H) / 2);
    for (let i = 0; i < NUM_PROJ; i++) {
      imgTops[i] = imgTop0 + i * SECTION_H;
      imgEls[i].style.top = imgTops[i] + 'px';
      // also update the click overlay
      const link = document.querySelectorAll('.section-link')[i];
      if (link) link.style.top = imgTops[i] + 'px';
    }

    document.body.style.height = ((SECTION_H * (NUM_PROJ - 1) + canvasVH) * scale) + 'px';
    layout();
    document.querySelectorAll('.nav-label, .nav-label-active').forEach(el => { el.style.top = (window.innerHeight / 2 / scale) + 'px'; });
    const pl = document.querySelector('.name-rotated'); if (pl) pl.style.top = (window.innerHeight / 2 / scale) + 'px';
  }

  // ── MOBILE WORK LIST (built from the same `projects` data, shown only on small screens) ──
  function buildMobileWorkList() {
    const list = document.getElementById('mobileWorkList');
    if (!list || list.children.length) return;
    const imgSrcs = [...imgEls].map(el => el.querySelector('img').getAttribute('src'));
    projects.forEach((p, i) => {
      const a = document.createElement('a');
      a.href = p.link;
      a.className = 'mobile-work-item';
      a.innerHTML = `
        <img src="${imgSrcs[i]}" alt="${p.co}">
        <div class="mobile-work-item-title">${p.co}</div>
        <div class="mobile-work-item-meta">${p.type}<br>${p.role}<br>${p.year}</div>
      `;
      list.appendChild(a);
    });
  }
  buildMobileWorkList();

  scaleToFit();
  bulletEls.forEach((b, i) => b.addEventListener('click', () => snapTo(i)));
  // Show first project's description after brief load delay
  setTimeout(() => updateText(0), 300);
  window.addEventListener('resize', scaleToFit);
  window.addEventListener('scroll', onScroll, { passive: true });
</script>

</body>
</html>
